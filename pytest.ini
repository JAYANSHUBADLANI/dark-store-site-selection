[pytest]
testpaths = tests
filterwarnings =
    # PuLP 3.x deprecates PULP_CBC_CMD in favour of COIN_CMD, but COIN_CMD needs
    # a separately installed CBC binary and reports unavailable here, while
    # PULP_CBC_CMD uses the binary PuLP ships. Keeping the working one and
    # silencing the notice, rather than adding a system dependency for a rename.
    ignore:PULP_CBC_CMD is deprecated:DeprecationWarning
    # PuLP 4.0 will require prob.add_variable() instead of constructing
    # LpVariable directly. Noted rather than pre-emptively rewritten, since the
    # pinned version in requirements.txt is 3.x.
    ignore:Constructing LpVariable:DeprecationWarning
